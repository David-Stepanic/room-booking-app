databaseChangeLog:
  - changeSet:
      id: 003-create-reservations
      author: david.stepanic
      changes:
        - createTable:
            tableName: reservation
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true

              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: purpose
                  type: TEXT

              - column:
                  name: start_time
                  type: TIMESTAMP

              - column:
                  name: end_time
                  type: TIMESTAMP

              - column:
                  name: reservation_status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: decision_made_at
                  type: TIMESTAMP

              - column:
                  name: declined_reason
                  type: TEXT

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: room_id
                  type: BIGINT
                  constraints:
                    nullable: false

        # ForeignKey → user
        - addForeignKeyConstraint:
            baseTableName: reservation
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_reservation_user

        # ForeignKey → room
        - addForeignKeyConstraint:
            baseTableName: reservation
            baseColumnNames: room_id
            referencedTableName: room
            referencedColumnNames: id
            constraintName: fk_reservation_room

      rollback:
        - dropTable:
            tableName: reservation