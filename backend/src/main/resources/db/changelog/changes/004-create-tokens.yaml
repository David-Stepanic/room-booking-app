databaseChangeLog:
  - changeSet:
      id: 004-password-reset-tokens
      author: david.stepanic
      changes:
        - createTable:
            tableName: password_reset_token
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true

              - column:
                  name: token
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: expiry_date
                  type: TIMESTAMP

        # ForeignKey -> user
        - addForeignKeyConstraint:
            baseTableName: password_reset_token
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_password_reset_token_user

      rollback:
        - dropTable:
            tableName: password_reset_token

  - changeSet:
      id: 005-verification-tokens
      author: david.stepanic
      changes:
        - createTable:
            tableName: verification_token
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true

              - column:
                  name: token
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: expiry_date
                  type: TIMESTAMP

        # ForeignKey -> user
        - addForeignKeyConstraint:
            baseTableName: verification_token
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_verification_token_user

      rollback:
        - dropTable:
            tableName: verification_token

